name: Go platform matrix

# Go-only validation of the pkg/ module across supported OS and architecture
# targets. It needs no checker checkout and no reference tools, so it is
# independent of the owner-blocked checker pin in test-go.yml. Manual only.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  matrix:
    name: ${{ matrix.os }} ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: amd64
            runner: ubuntu-latest
          - os: linux
            arch: arm64
            runner: ubuntu-24.04-arm
          - os: darwin
            arch: arm64
            runner: macos-latest
          - os: windows
            arch: amd64
            runner: windows-latest
    steps:
      - name: Check out Quint
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache-dependency-path: pkg/go.sum
      - name: Check formatting
        if: runner.os != 'Windows'
        run: test -z "$(gofmt -l .)"
        working-directory: pkg
      - name: Vet
        run: go vet ./...
        working-directory: pkg
        env:
          GOTOOLCHAIN: local
          GOFLAGS: -mod=readonly
      - name: Test
        run: go test -count=1 -timeout 60m ./...
        working-directory: pkg
        env:
          GOTOOLCHAIN: local
          GOFLAGS: -mod=readonly
