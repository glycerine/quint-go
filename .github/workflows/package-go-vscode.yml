name: Package native Go VSCode extension

# A compatible checker commit is not yet published as a pinned public baseline.
# Require an explicit accessible revision, as in test-go.yml, until it is.
on:
  workflow_dispatch:
    inputs:
      checker_ref:
        description: Accessible full 40-character glycerine/apalache-go commit SHA
        required: true
        type: string

permissions:
  contents: read

jobs:
  native-vsix:
    name: Package ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            host: Linux/X64
            target: linux-x64
            goos: linux
            goarch: amd64
          # GitHub's macos-14 standard runner uses Apple Silicon.
          - runner: macos-14
            host: macOS/ARM64
            target: darwin-arm64
            goos: darwin
            goarch: arm64
    env:
      GOWORK: 'off'
      GOFLAGS: -mod=readonly
      GOTOOLCHAIN: local
      CGO_ENABLED: '0'
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
      VSIX_TARGET: ${{ matrix.target }}
    steps:
      - name: Validate checker revision and native runner
        shell: bash
        env:
          CHECKER_REF: ${{ inputs.checker_ref }}
          EXPECTED_HOST: ${{ matrix.host }}
        run: |
          set -euo pipefail
          if [[ ! "$CHECKER_REF" =~ ^[0-9a-f]{40}$ ]]; then
            printf '%s\n' 'checker_ref must be a full lowercase commit SHA' >&2
            exit 1
          fi
          if [[ "$RUNNER_OS/$RUNNER_ARCH" != "$EXPECTED_HOST" ]]; then
            printf '%s\n' "Expected native runner $EXPECTED_HOST, found $RUNNER_OS/$RUNNER_ARCH" >&2
            exit 1
          fi
      - name: Check out Quint
        uses: actions/checkout@v4
        with:
          path: quint-go
          persist-credentials: false
      - name: Check out explicitly selected Go checker
        uses: actions/checkout@v4
        with:
          repository: glycerine/apalache-go
          ref: ${{ inputs.checker_ref }}
          path: apalache-go
          persist-credentials: false
      - name: Verify checker checkout
        shell: bash
        env:
          CHECKER_REF: ${{ inputs.checker_ref }}
        run: |
          set -euo pipefail
          test -f apalache-go/pkg/go.mod
          actual_revision=$(git -C apalache-go rev-parse HEAD)
          [[ "$actual_revision" == "$CHECKER_REF" ]]
          [[ -z "$(git -C apalache-go status --porcelain --untracked-files=normal)" ]]
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache-dependency-path: |
            quint-go/pkg/go.sum
            apalache-go/pkg/go.sum
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            quint-go/vscode/quint-vscode/package-lock.json
            quint-go/vscode/quint-vscode/server/package-lock.json
      - name: Create isolated Go workspace
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(go env GOVERSION)" == go1.27.3 ]]
          stage_dir=$(mktemp -d "$RUNNER_TEMP/quint-vscode-work.XXXXXXXX")
          export GOWORK="$stage_dir/go.work"
          cd -- "$stage_dir"
          go work init "$GITHUB_WORKSPACE/quint-go/pkg" "$GITHUB_WORKSPACE/apalache-go/pkg"
          test -f "$GOWORK"
          printf 'GOWORK=%s\n' "$GOWORK" >> "$GITHUB_ENV"
      - name: Install locked extension dependencies
        working-directory: quint-go/vscode/quint-vscode
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install locked TypeScript server dependencies
        working-directory: quint-go/vscode/quint-vscode/server
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Compile, lint, and test extension
        working-directory: quint-go/vscode/quint-vscode
        run: |
          npm run compile
          npm run format-check
          npm test
      - name: Test and vet Go server packages
        working-directory: quint-go/pkg
        run: |
          go test ./... -count=1
          go vet ./...
      - name: Install isolated pinned VSIX packaging tool
        shell: bash
        run: |
          set -euo pipefail
          tool_dir=$(mktemp -d "$RUNNER_TEMP/quint-vsce.XXXXXXXX")
          npm install --prefix "$tool_dir" --ignore-scripts --no-audit --no-fund --save-exact @vscode/vsce@4.1.0
          vsce_bin="$tool_dir/node_modules/.bin/vsce"
          [[ "$("$vsce_bin" --version)" == 4.1.0 ]]
          printf 'VSCE_BIN=%s\n' "$vsce_bin" >> "$GITHUB_ENV"
      - name: Package native extension
        working-directory: quint-go/vscode/quint-vscode
        shell: bash
        run: |
          set -euo pipefail
          "$VSCE_BIN" package --target "$VSIX_TARGET" --out "$RUNNER_TEMP/quint-$VSIX_TARGET.vsix"
      - name: Inspect VSIX and smoke bundled Go server
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import selectors
          import subprocess
          import tempfile
          import time
          import xml.etree.ElementTree as ET
          import zipfile

          target = os.environ['VSIX_TARGET']
          artifact = Path(os.environ['RUNNER_TEMP']) / f'quint-{target}.vsix'
          with zipfile.ZipFile(artifact) as archive:
              names = set(archive.namelist())
              required = {
                  'extension/client/out/extension.js',
                  'extension/client/out/serverSelection.js',
                  'extension/node_modules/vscode-languageclient/package.json',
                  'extension/node_modules/vscode-jsonrpc/package.json',
                  'extension/server/out/src/server.js',
                  'extension/server/out/src/worker.js',
                  'extension/server/node_modules/@informalsystems/quint/package.json',
                  'extension/server/node_modules/vscode-languageserver/package.json',
              }
              assert required <= names, f'Missing packaged runtime files: {required - names}'
              manifest = ET.fromstring(archive.read('extension.vsixmanifest'))
              identity = manifest.find('{*}Metadata/{*}Identity')
              assert identity is not None and identity.attrib['TargetPlatform'] == target
              binary_info = archive.getinfo('extension/bin/quint-lsp')
              binary_mode = (binary_info.external_attr >> 16) & 0o777
              assert binary_mode & 0o111, 'Bundled server lost its executable mode'
              binary_bytes = archive.read(binary_info)

          def send(process, message):
              body = json.dumps(message, separators=(',', ':')).encode()
              process.stdin.write(f'Content-Length: {len(body)}\r\n\r\n'.encode() + body)
              process.stdin.flush()

          with tempfile.TemporaryDirectory(prefix='quint-vsix-smoke-') as directory:
              binary = Path(directory) / 'quint-lsp'
              binary.write_bytes(binary_bytes)
              binary.chmod(binary_mode)
              with subprocess.Popen([str(binary)], stdin=subprocess.PIPE, stdout=subprocess.PIPE,
                                    stderr=subprocess.PIPE, cwd=directory,
                                    env=dict(os.environ, PATH='/nonexistent')) as process:
                  with selectors.DefaultSelector() as selector:
                      selector.register(process.stdout, selectors.EVENT_READ)
                      pending = bytearray()

                      def response(expected_id):
                          deadline = time.monotonic() + 10
                          while True:
                              separator = pending.find(b'\r\n\r\n')
                              if separator >= 0:
                                  header = pending[:separator].decode('ascii')
                                  lengths = [int(line.split(':', 1)[1]) for line in header.split('\r\n')
                                             if line.lower().startswith('content-length:')]
                                  assert len(lengths) == 1, header
                                  end = separator + 4 + lengths[0]
                                  if len(pending) >= end:
                                      message = json.loads(pending[separator + 4:end])
                                      del pending[:end]
                                      if message.get('id') == expected_id:
                                          assert 'error' not in message, message
                                          return message['result']
                                      continue
                              remaining = deadline - time.monotonic()
                              assert remaining > 0 and selector.select(remaining), 'LSP response timed out'
                              chunk = os.read(process.stdout.fileno(), 65536)
                              assert chunk, 'LSP exited before responding'
                              pending.extend(chunk)

                      try:
                          send(process, {'jsonrpc': '2.0', 'id': 1, 'method': 'initialize',
                                         'params': {'processId': None, 'capabilities': {}}})
                          initialized = response(1)
                          assert initialized['serverInfo']['name'] == 'quint-go'
                          assert initialized['capabilities']['positionEncoding'] == 'utf-16'
                          send(process, {'jsonrpc': '2.0', 'id': 2, 'method': 'shutdown'})
                          assert response(2) is None
                          send(process, {'jsonrpc': '2.0', 'method': 'exit'})
                          process.stdin.close()
                          assert process.wait(timeout=10) == 0, process.stderr.read().decode()
                      finally:
                          if process.poll() is None:
                              process.kill()
                              process.wait()
          print(f'Verified {artifact.name}: native target, runtime files, executable mode, and Go LSP lifecycle')
          PY
      - name: Verify dependency manifests stayed unchanged
        working-directory: quint-go
        run: |
          git diff --exit-code -- pkg/go.mod pkg/go.sum \
            vscode/quint-vscode/package.json vscode/quint-vscode/package-lock.json \
            vscode/quint-vscode/server/package.json vscode/quint-vscode/server/package-lock.json
      - name: Upload native VSIX
        uses: actions/upload-artifact@v4
        with:
          name: quint-vscode-${{ matrix.target }}
          path: ${{ runner.temp }}/quint-${{ matrix.target }}.vsix
          if-no-files-found: error
          retention-days: 7
